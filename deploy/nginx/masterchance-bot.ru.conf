# nginx для masterchance-bot.ru → контейнер с сайтом на 127.0.0.1:8080
#
# Здесь только HTTP. Сертификат и переадресацию на https допишет сюда сам
# certbot (`certbot --nginx`) — руками TLS-блок писать не нужно и не надо:
# certbot потом обновляет сертификат каждые 90 дней в этом же файле.
#
# Установка:  scripts/setup_https.sh   (делает всё нижеперечисленное сам)

# Кеш статики на стороне nginx.
#
# Раньше КАЖДЫЙ шрифт, стиль и htmx уходил в python: ни одной директивы root
# здесь нет, всё отдаётся через proxy_pass. То есть восемь запросов на холодную
# загрузку страницы конкурировали за единственный воркер uvicorn с самой
# отрисовкой страниц — на двухъядерном сервере это заметно.
#
# Кеш выбран вместо отдачи с диска намеренно: репозиторий лежит в домашнем
# каталоге root (см. СЕРВЕР.md), а nginx работает от www-data и туда не
# заглянет. Копировать файлы в /var/www пришлось бы после каждого git pull, и
# рано или поздно копия бы протухла. Кеш такого шва не создаёт: он наполняется
# сам и сам протухает по таймеру ниже.
#
# Директива уровня http, поэтому стоит ВНЕ server — файл подключается из
# conf.d, а он включается как раз в http.
proxy_cache_path /var/cache/nginx/masterchance
                 levels=1:2
                 keys_zone=mc_static:10m
                 max_size=256m
                 inactive=30d
                 use_temp_path=off;

server {
    listen 80;
    listen [::]:80;

    server_name masterchance-bot.ru www.masterchance-bot.ru;

    # Telegram Mini App грузится во встроенном webview — на медленной мобильной
    # сети запрос легко идёт дольше дефолтных нескольких секунд.
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Сжатие. Без него htmx (48 КБ) и стили едут как есть; на мобильной сети
    # это заметно. Шрифты .woff2 уже сжаты внутри — их жать бессмысленно.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        # Канонический адрес — без www. Оба имени обслуживает один блок (так
        # проще для сертификата: certbot выпускает его на оба имени и сам
        # дописывает сюда TLS), поэтому www отправляем на основной адрес.
        # Без этого один и тот же сайт открывается по двум адресам сразу.
        #
        # Намеренно ВНУТРИ location /, а не на уровне server: серверный `if`
        # сработал бы и на /.well-known/acme-challenge/, по которому Let's
        # Encrypt подтверждает домен www при каждом продлении, и сломал бы его.
        # Свою локацию для проверки certbot заводит с приоритетом выше этой.
        if ($host = www.masterchance-bot.ru) {
            return 301 https://masterchance-bot.ru$request_uri;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # без этого приложение считает, что работает по http, и может
        # собрать ссылку на http:// — Telegram такую страницу не откроет
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Шрифты не меняются никогда: имя файла включает вес и подмножество, а
    # новая версия приезжает под новым именем. Кешируем надолго — иначе каждая
    # загрузка страницы стоит лишних запросов на проверку «не изменилось ли».
    location ~* ^/static/fonts/.*\.woff2$ {
        proxy_pass http://127.0.0.1:8080;
        # Без явной версии nginx ходит к приложению по HTTP/1.0, то есть
        # закрывает соединение после каждого файла. Шрифтов несколько — это
        # несколько лишних установок соединения на ровном месте.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache mc_static;
        proxy_cache_valid 200 30d;
        # Если приложение занято или упало, отдаём из кеша, а не 502: шрифт
        # месячной давности — ровно тот же шрифт.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Стили и скрипты меняются при обновлении проекта, поэтому кеш короткий:
    # быстро, но правка доезжает до людей в тот же час.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Кеш держим тот же час, что и браузерный: правка доезжает до людей за
        # то же время, что и раньше, но python её больше не отдаёт по разу на
        # каждого посетителя.
        proxy_cache mc_static;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        expires 1h;
        add_header Cache-Control "public";
    }
}
