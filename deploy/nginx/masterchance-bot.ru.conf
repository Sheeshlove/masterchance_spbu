# nginx для masterchance-bot.ru → контейнер с сайтом на 127.0.0.1:8080
#
# Здесь только HTTP. Сертификат и переадресацию на https допишет сюда сам
# certbot (`certbot --nginx`) — руками TLS-блок писать не нужно и не надо:
# certbot потом обновляет сертификат каждые 90 дней в этом же файле.
#
# Установка:  scripts/setup_https.sh   (делает всё нижеперечисленное сам)

server {
    listen 80;
    listen [::]:80;

    server_name masterchance-bot.ru www.masterchance-bot.ru;

    # Telegram Mini App грузится во встроенном webview — на медленной мобильной
    # сети запрос легко идёт дольше дефолтных нескольких секунд.
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Сжатие. Без него htmx (48 КБ) и стили едут как есть; на мобильной сети
    # это заметно. Шрифты .woff2 уже сжаты внутри — их жать бессмысленно.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # без этого приложение считает, что работает по http, и может
        # собрать ссылку на http:// — Telegram такую страницу не откроет
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Шрифты не меняются никогда: имя файла включает вес и подмножество, а
    # новая версия приезжает под новым именем. Кешируем надолго — иначе каждая
    # загрузка страницы стоит лишних запросов на проверку «не изменилось ли».
    location ~* ^/static/fonts/.*\.woff2$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Стили и скрипты меняются при обновлении проекта, поэтому кеш короткий:
    # быстро, но правка доезжает до людей в тот же час.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }
}
