<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}MasterChance — посмотри свои шансы{% endblock %}</title>
  <meta name="theme-color" content="#FBFAF7">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/static/fonts/Inter-400-cyrillic.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/static/fonts/PoiretOne-400-cyrillic.woff2">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/styles.css">
  <!-- htmx лежит у нас, а не на unpkg: сайт открывают из России, и чужой CDN
       в критическом пути — лишняя задержка на каждой загрузке. -->
  <script src="/static/htmx.min.js" defer></script>
  <!-- SDK Telegram обязан грузиться с telegram.org: со своей копией Mini App
       не заработает. Но обязательно defer — без него это блокирующий скрипт
       в <head>, и страница не рисуется, пока telegram.org не ответит.
       Порядок с /static/telegram.js сохраняется: defer-скрипты выполняются
       по очереди, так что SDK успевает загрузиться раньше. -->
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/static/telegram.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">MasterChance</a>
    <nav>
      <a href="/mechanism">Как всё устроено</a>
      <a href="/how">Как работает прогноз</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p class="footer-note">{{ footer_note_lead
      }}<a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>
    <p class="footer-note">{{ credit_lead
      }}<a href="{{ original_author_url }}" rel="noopener">{{ original_author }}</a></p>
    <p class="footer-row">
      <span>{{ disclaimer_short }}</span>
      <a href="{{ repo_url }}" rel="noopener">{{ repo_label }} →</a>
    </p>
  </footer>
</body>
</html>
