<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}MasterChance — посмотри свои шансы{% endblock %}</title>
  <meta name="theme-color" content="#FBFAF7">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/static/fonts/Inter-400-cyrillic.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/static/fonts/PoiretOne-400-cyrillic.woff2">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/styles.css">
  <!-- Всё, что грузит страница, лежит у нас: сайт открывают из России, и
       любой зарубежный хост в критическом пути — риск и задержка.
       SDK Telegram здесь намеренно НЕ подключается тегом: telegram.js сам
       подтянет его, и только если мы действительно внутри Telegram. -->
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/telegram.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">MasterChance</a>
    <nav>
      <a href="/mechanism">Как всё устроено</a>
      <a href="/how">Как работает прогноз</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p class="footer-note">{{ footer_note_lead
      }}<a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>
    <p class="footer-note">{{ credit_lead
      }}<a href="{{ original_author_url }}" rel="noopener">{{ original_author }}</a></p>
    <p class="footer-row">
      <span>{{ disclaimer_short }}</span>
      <a href="{{ repo_url }}" rel="noopener">{{ repo_label }} →</a>
    </p>
  </footer>
</body>
</html>
