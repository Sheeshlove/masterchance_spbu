# Три сервиса на одном образе, общая база через том ./data.
#
#   docker compose up -d --build          поднять всё
#   docker compose up -d --build web      только сайт
#   docker compose logs -f updater        смотреть, как идёт обновление
#   docker compose down                   остановить всё
#
# Кто за что отвечает:
#   updater — раз в 3 часа тянет списки, считает Монте-Карло, публикует снапшот;
#   web     — сайт и Telegram Mini App (наружу через nginx, см. СЕРВЕР.md);
#   bot     — Telegram-бот.
#
# Данные считает ТОЛЬКО updater. bot и web их лишь показывают, поэтому
# перезапускать их можно в любой момент без потери чего-либо.
services:
  updater:
    build: .
    image: masterchance:local
    command: ["scripts/autoupdate.py"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TIMEZONE: Europe/Moscow
    volumes:
      - ./data:/app/data
      - ./dist:/app/dist      # сюда кладётся снапшот перед публикацией
    restart: unless-stopped

  web:
    build: .
    image: masterchance:local
    command: ["web.py"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TIMEZONE: Europe/Moscow
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
    ports:
      # только на localhost: наружу пускает nginx, который держит сертификат.
      # Без 127.0.0.1 порт 8080 торчал бы в интернет по голому http.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    image: masterchance:local
    command: ["bot.py"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TIMEZONE: Europe/Moscow
    volumes:
      - ./data:/app/data
    restart: unless-stopped
